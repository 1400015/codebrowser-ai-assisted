<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <title>CodeBrowser</title>
    <link rel="stylesheet" href="./sidepanel.css" />

  <body>
    <div class="app">
      <header>
        <h1>CodeBrowser</h1>
        <span id="status">workspace fechado</span>

    </div>
    <script type="module" src="./sidepanel.ts"></script>
  </body>
</html>
